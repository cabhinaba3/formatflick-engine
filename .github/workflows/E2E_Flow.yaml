name: End to End Flow

on:
  push:
    branches:
      - 'main'

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12-dev"

    name: Test
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
#
#      - name: Create and activate virtual environment
#        run: |
#          python -m venv venv
#          source venv/bin/activate

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest xmltodict openpyxl lxml psutil

      - name: Unit Testing
        run: pytest

      - name: E2E Flow
        run: |
          pip install -e .
          cd examples
          python -m pip install requests
          python examples.py
          
